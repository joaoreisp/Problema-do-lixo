<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar reclamação</title>
    <script src="https://kit.fontawesome.com/a1f3395f52.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/css_reclamar/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/css_reclamar/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/css_reclamar/style.css') }}">

</head>

<body>
    <nav class="navbar">

        <div class="navbar-container">
            <div class="navbar-left">

                <a href="#" class="menu-icons" id="notification-icon">
                    <i class="fa-solid fa-bell"></i>
                </a>

                <div id="notification-overlay" class="overlay">
                    <div class="popup">
                        <h2>Notificações</h2>
                        <p>Você tem novas notificações!</p>
                        <button id="close-popup" class="close-btn">Fechar</button>
                    </div>
                </div>


                <input type="text" class="search-bar" placeholder="Pesquisar">
                <div class="form-icons">

                    <a href="/reclamacoes" class="menu-icons">
                        <i class="fa-solid fa-house"></i>
                    </a>

                    <a href="#" class="menu-icons">
                        <i class="fa-solid fa-comment-dots"></i>
                    </a>

                    <a href="/graficos" class="menu-icons">
                        <i class="fa-solid fa-chart-pie"></i>
                    </a>

                </div>

            </div>
            <div class="user-info">
                <div class="user-avatar">{{ session['nickname'] }}</div>
                <div class="user-details">
                    <span class="username">{{ session['usuario_nome'] }}</span>
                    <span class="role">{{ session['usuario_profissao'] }}</span>
                </div>
            </div>
        </div>
    </nav>
    <form action="{{ url_for('reclamacao.criar_reclamacao') }}" method="POST" enctype="multipart/form-data">


        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


        <div class="container">
            <div class="complaint-form">
                <h2>Criar reclamação</h2>
                <div class="user-profile">
                    <div class="profile-initials">{{ session['nickname'] }}</div>
                    <div class="profile-info">
                        <span class="name">{{ session['usuario_nome'] }}</span>
                        <span class="role">{{ session['usuario_profissao'] }}</span>
                    </div>
                </div>
                <div class="form-fields">
                    <div class="dropdowns">
                        <select id="sector" name="sector">
                            <option disabled selected>Setor reclamado</option>
                            <option>Coleta de lixo</option>
                            <option>Resíduos de construções</option>
                            <option>Saneamento básico</option>
                            <option>Descarte ilegal</option>
                            <option>Meio ambiente</option>
                            <option>Lixeiras e infraestrutura</option>
                        </select>
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" required>
                        <button type="button" id="buscar-cep">Buscar</button>
                        <!-- Campos ocultos para cidade e bairro -->
                        <input type="hidden" id="city" name="city">
                        <input type="hidden" id="neighborhood" name="neighborhood">

                    </div>
                    <div id="complaintContent">
                        <textarea id="description" name="description" class="description"
                            placeholder="Descreva a sua reclamação." required></textarea>
                    </div>


                    <div class="textarea-navbar">

                        <div class="icon-group-left">
                            <button class="btn icon-btn" id="attachButton">
                                <i class="fa-solid fa-paperclip"></i>
                            </button>
                            <input type="file" id="fileInput" name="anexo" accept="image/*" style="display: none;">
                            <button class="btn icon-btn" id="emojiButton">
                                <i class="fa-solid fa-face-smile"></i>
                            </button>
                        </div>


                        <div class="button-group-right">
                            <button type="submit" id="publishButton" class="btn publish-btn">Publicar</button>
                            <button id="clearButton" class="btn clear-btn">Limpar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <script>
        document.getElementById('buscar-cep').onclick = () => buscarCEP();

        function buscarCEP(callback) {
            var cep = document.getElementById('cep').value.replace(/\D/g, '');
            if (cep.length === 8) {
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                    .then(response => response.json())
                    .then(data => {
                        if (!data.erro) {
                            const cidade = data.localidade;
                            const bairro = data.bairro;

                            // Atualiza os campos ocultos com cidade e bairro
                            document.getElementById('city').value = cidade;
                            document.getElementById('neighborhood').value = bairro;

                            console.log(`Cidade: ${cidade}, Bairro: ${bairro}`);

                            // Verifica se o callback foi passado e executa, caso exista
                            if (typeof callback === "function") {
                                callback(true);
                            }
                        } else {
                            alert('CEP não encontrado.');
                            if (typeof callback === "function") {
                                callback(false);
                            }
                        }
                    })
                    .catch(error => {
                        console.error('Erro ao buscar CEP:', error);
                        alert('Erro ao buscar CEP.');
                        if (typeof callback === "function") {
                            callback(false);
                        }
                    });
            } else {
                alert('Por favor, insira um CEP válido.');
                if (typeof callback === "function") {
                    callback(false);
                }
            }
        }

        // Intercepta o envio do formulário
        document.querySelector('form').addEventListener('submit', function (event) {
            // Verifica se um arquivo foi selecionado no campo de anexo
            const fileInput = document.getElementById("fileInput");

            // Se não houver arquivo anexado, impede o envio do formulário
            if (!fileInput.files.length) {
                alert("Por favor, anexe um arquivo antes de enviar.");
                event.preventDefault();
                return;
            }

            // Verifica se os campos de cidade e bairro já estão preenchidos
            const cityField = document.getElementById('city');
            const neighborhoodField = document.getElementById('neighborhood');

            // Se os campos de cidade ou bairro não estão preenchidos
            if (!cityField.value || !neighborhoodField.value) {
                // Previne o envio e realiza a busca de CEP
                event.preventDefault();
                buscarCEP(function (success) {
                    if (success) {
                        // Após a busca bem-sucedida, verifica novamente se os campos estão preenchidos
                        if (cityField.value && neighborhoodField.value) {
                            // Reenvia o formulário após a busca bem-sucedida
                            document.querySelector('form').submit();
                        }
                    }
                });
            } else {
                // Se os campos de cidade e bairro já estão preenchidos, permite o envio
                // (Aqui você pode adicionar a lógica para coletar dados do formulário se necessário)
            }
        });



        // Exibir o popup e o fundo preto ao clicar no ícone
        document.getElementById('notification-icon').addEventListener('click', function (event) {
            event.preventDefault(); // Prevenir o comportamento padrão do link

            // Exibir o overlay com o popup
            document.getElementById('notification-overlay').style.display = 'flex';
        });

        // Fechar o popup ao clicar no botão "Fechar"
        document.getElementById('close-popup').addEventListener('click', function () {
            document.getElementById('notification-overlay').style.display = 'none';
        });

        // Função para limpar o conteúdo do div contenteditable
        const clearButton = document.getElementById("clearButton");
        const complaintContent = document.getElementById("complaintContent");

        clearButton.addEventListener("click", function () {
            complaintContent.innerHTML = "";
        });

        // Função para selecionar a imagem ao clicar no ícone de anexar
        const attachButton = document.getElementById("attachButton");
        const fileInput = document.getElementById("fileInput");

        // Abrir a pasta de imagens ao clicar no ícone de anexar
        attachButton.addEventListener("click", function () {
            event.preventDefault();
            fileInput.click();
        });

        // Adicionar a imagem no div contenteditable quando o usuário selecionar uma imagem
        fileInput.addEventListener("change", function () {
            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = function (e) {
                const image = document.createElement("img");
                image.src = e.target.result;
                image.style.maxWidth = "100%";
                image.style.height = "auto";

                complaintContent.appendChild(image);
            };

            if (file) {
                reader.readAsDataURL(file);
            }
        });




        document.addEventListener("DOMContentLoaded", function () {
            const publishButton = document.getElementById("publishButton");
            if (publishButton) {
                publishButton.addEventListener("click", function () {
                    // Captura os dados do formulário
                    const sector = document.getElementById("sector").value;
                    const complaintContent = document.getElementById("complaintContent").innerText;

                    console.log("Setor:", sector);
                    console.log("Cidade:", city);
                    console.log("Bairro:", neighborhood);
                    console.log("Conteúdo da Reclamação:", complaintContent);

                    if (sector && complaintContent &&
                        sector !== "Setor reclamado" && city !== "Cidade") {
                        // Cria um objeto para armazenar os dados
                        const complaint = {
                            sector: sector,
                            content: complaintContent,
                            user: "Rafael Rodrigues",  // Exemplo, você pode personalizar
                            role: "Aluno"  // Exemplo, você pode personalizar
                        };

                        // Recupera as reclamações existentes no localStorage
                        let complaints = JSON.parse(localStorage.getItem("complaints")) || [];

                        // Adiciona a nova reclamação à lista
                        complaints.push(complaint);

                        // Armazena a lista de reclamações no localStorage
                        localStorage.setItem("complaints", JSON.stringify(complaints));

                        // Redireciona para a página Home
                        window.location.href = "/";
                    } else {
                        alert("Por favor, preencha todos os campos.");
                    }
                });
            } else {
                console.error("O botão de publicação não foi encontrado.");
            }
        });
    </script>
</body>

</html>
